[project]
name = "synthetic-cifar10-zeroshot"
version = "1.0.0"
description = "Frozen PE-Core encoders and a linear head trained on generated images for Synthetic CIFAR-10 (RecVis 2026, A3)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10",
    "torch>=2.3",
    "torchvision>=0.18",
    "open-clip-torch>=2.32",
    "transformers>=4.45",
    "scikit-learn>=1.3",
    "diffusers>=0.30",
]

[tool.uv]
# Scripts run from this folder (uv run python predict.py ...); nothing to build or install as a package.
package = false
